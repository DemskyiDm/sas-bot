<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAS Logistic — Raport godzin</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ── тільки для сторінки «Raport godzin» ── */
    input[type="time"], input[type="text"].inp, select.sel {
      background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-size: 12px;
      padding: 5px 8px; border-radius: 5px; outline: none; font-family: inherit; color-scheme: dark; }
    .section { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; overflow: hidden; }
    .section-head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border);
      font-size: 13px; font-weight: 600; flex-wrap: wrap; }
    .section-head .cnt { font-size: 11px; color: var(--text2); font-weight: 400; }
    .section-head .spacer { margin-left: auto; }
    .note { padding: 8px 14px; font-size: 11px; color: var(--text3); border-top: 1px solid var(--border); line-height: 1.5; }
    .banner { padding: 9px 14px; font-size: 12px; border-radius: 8px; margin-bottom: 14px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text2); line-height: 1.5; }
    .cfg { display: grid; grid-template-columns: 220px 1fr; gap: 8px 14px; padding: 12px 14px; align-items: center; font-size: 12px; }
    .cfg .k { color: var(--text2); }
    .cfg .h { grid-column: 2; font-size: 11px; color: var(--text3); margin-top: -4px; }
    .days label, .chk-row label { margin-right: 12px; font-size: 12px; color: var(--text); white-space: nowrap; }
    .actions { display: flex; gap: 8px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .msg { font-size: 11px; } .msg.err { color: var(--red); } .msg.ok { color: var(--green); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .tblwrap { overflow-x: auto; }
    table.fl { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.fl th { text-align: left; padding: 7px 8px; font-size: 10px; letter-spacing: .6px; color: var(--text3);
      border-bottom: 1px solid var(--border); font-family: var(--mono); text-transform: uppercase; white-space: nowrap; }
    table.fl td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    table.fl td.c, table.fl th.c { text-align: center; }
    table.fl tr.off td { opacity: .55; }
    table.fl tr:hover td { background: var(--surface2); }
    .sub { font-size: 10px; color: var(--text3); }
    .tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 8px; border: 1px solid var(--border); color: var(--text2); white-space: nowrap; }
    .tag.head { border-color: var(--accent); color: var(--accent); }
    .tag.bad { border-color: var(--red); color: var(--red); }
    .good { color: var(--green); } .bad { color: var(--red); } .dim { color: var(--text3); }
    .empty, .loading { padding: 26px; text-align: center; color: var(--text3); font-size: 12px; }
    .noaccess { max-width: 520px; margin: 60px auto; text-align: center; color: var(--text2); font-size: 13px; line-height: 1.6; }
    .main { min-width: 0; }
    .content > * { flex-shrink: 0; }   /* sekcje nie ściskają się w kolumnie */
    @media (max-width: 900px) { .cfg { grid-template-columns: 1fr; } .cfg .h { grid-column: 1; } }
    @media (max-width: 800px) { .topbar { height: auto; flex-wrap: wrap; padding: 10px 16px; gap: 8px; } .topbar-right { display: none; } .content { padding: 12px; } }
  </style>
  <link rel="stylesheet" href="/css/mobile.css" />
</head>
<body>
  <div class="sidebar">
    <button class="sidebar-toggle" onclick="toggleSidebar()" title="Ukryj / Przypnij menu">◀</button>
    <div class="logo">
      <div class="logo-tag">SAS LOGISTIC</div>
      <div class="logo-name">Raport godzin</div>
    </div>
    <div class="nav">
      <div class="nav-item" onclick="location.href='index.html'">⬅️ Panel główny</div>
      <div class="nav-item active">⏰ Raport godzin</div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-title">Raport „kto nie wypełnił godzin” — dla koordynatorów</div>
      <div class="topbar-right"><span id="userName" style="font-size: 12px; color: var(--text2)"></span></div>
    </div>
    <div class="content" id="content"><div class="loading">Ładowanie…</div></div>
  </div>

  <script src="js/raport-godzin.js"></script>
  <div class="sidebar-hover-zone"
     onmouseenter="document.querySelector('.sidebar').classList.add('sidebar-peek')"
     onmouseleave="document.querySelector('.sidebar').classList.remove('sidebar-peek')"></div>
  <script>
  function toggleSidebar() {
    const hidden = document.body.classList.toggle('sidebar-hidden');
    const btn = document.querySelector('.sidebar-toggle');
    btn.textContent = hidden ? '▶' : '◀';
    btn.title = hidden ? 'Przypnij menu' : 'Ukryj menu';
    try { localStorage.setItem('sas_sidebar_hidden', hidden ? '1' : '0'); } catch (e) {}
  }
  if ((function () { try { return localStorage.getItem('sas_sidebar_hidden') === '1'; } catch (e) { return false; } })() || window.innerWidth < 800) {
    document.body.classList.add('sidebar-hidden');
    const btn = document.querySelector('.sidebar-toggle');
    if (btn) { btn.textContent = '▶'; btn.title = 'Przypnij menu'; }
  }
  </script>
</body>
</html>
